  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first project</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .main_container{
            width: 100%;
            height:100vh ;
            background-color: rgb(32, 24, 24);
            background-image: url("asset/bg1.jpg");
            background-position: center;
            background-size: cover;
            padding-top: 10px;
        }
        .header_container{
            width: 100%;
            height:10vh;
            background-color: rgba(15, 13, 13, 0.692);
            max-width: 800px;
            margin: 0px auto;
            border-radius: 15px;
        }
         .header_inner_container{
            padding: 0px 36px;
            align-items: center;
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
        } 
        .header_button{
            border-radius: 25px;
            cursor: pointer; 
            padding: 12px 8px;
            border: none;
            width: 100px;
            margin: 0px 4px;
             
        }
        .header_button:hover{
            background-color: black;
            color: white;
            transition: background-color 2s ease
        }
        .header_logo{
            width: 80px ;
            height: 45px;
        }
        .logo{
            width: 80px;
            height: 45px;
            object-fit: contain;
        }
        #content_container{
                width:"100%";
                height: 80vh;
                display: flex;
                align-items: center;
                justify-content: center;
        } 
        .content_innercontainer{
            width: 700px;
            height: 300px;
            background-color: rgba(0, 0, 0, 0.493);
            display: flex;
            align-items: center;
            flex-direction: column ;
            justify-content: center;
            border-radius: 15px;
        }
        .content_title{
            color: white;
            width: 650px;
            font-size: 50px;
            font-weight: 500;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin-bottom: 15px;

        }
        .content_title span{
            color:rgb(201, 21, 108);
        }
        .content_button{
            font-size: 14px;
            color: white;
            background-color: rgb(201, 21, 108);
            padding: 12px 10px;
            border-radius: 25px;
            width: 200px;
            border: none;

        }

            
</style>
</head>
<body>
    <div class=" main_container">
        <!-- header -->
        <div class="header_container"->
            <!-- this is for logo -->
             <div class="header_inner_container">
                <div class="header_logo">
                    <img src="./asset/logo.png" class="logo"/>
                </div>
                <div>
                    <button class="header_button">Home</button>
                    <button class="header_button">About us</button>
                    <button class="header_button">contant us</button>
             </div>
            </div>
         </div>
         <!-- content -->
         <div id="content_container">
            <div class="content_innercontainer">
                <h1 class="content_title"> EMMANUEL CHILDREN'S <span>FOUNDATION</span></h1>
                <div>
                    <button class="content_button">click here </button>
                </div>
            </div>
         </div>
        <div>
            <h2 style="color: white;">copyright emmanuel 2024</h2>
        </div>
    </div>
</body>
</html>
