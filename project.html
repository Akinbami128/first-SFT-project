<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    *{
        padding: 0px;
        margin: 0px
    }
    /* #main-container{
        width:100%;
        height:100vh;
        background-color: orange
    } */
     .main__container{
        width:100%;
        height:100vh;
        background-color: rgb(48, 47, 45,);
        background-image: url(/asset/bg1.jpg);
        background-position: center;
        background-size: cover;
        padding-top: 20px;

       
     }
     .header__container{
        width:100%;
        height:12vh;
        background-color: rgba(41, 41, 35, 0.7 );
        max-width: 800px;
        margin: 10px auto;
        border-radius: 15px;
     }
     .header__inner__container{
        padding: 0px 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 15px
    }
    .header__logo{
        width: 50px;
        height: 50px;
    }
    .logo{
        width: 50px;
        height: 50px;
        object-fit:cover;
    }
    .header__button{
        padding: 12px 8px;
        border-radius: 12px;
        cursor: pointer;
        border: none;
        width: 100px;
        margin: 0px 4px;
    }
    .header__button:hover{
        background-color: black;
        color: white;
        transition: background-color 2s ease ;
    }
    #content__containter{
        width: 100%;
        height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .content__inner__container{
        width: 700px;
        height: 300px;
        border-radius: 15px;
        background-color:rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    .content__title{
        color: rgb(235, 229, 233);
        text-align: center;
        margin-bottom: 25px;
        font-weight: 900;
        font-size: 50px;
        font-family:'Times New Roman', Times, serif;
    }
    .content__title span{
        color:rgb(201, 21, 108);

    }
    .content__button{
        padding: 12px 10px;
        border-radius: 25px;
        font-size: 20px;
        color: white;
        background-color:rgb(201, 21, 108);
        width: 200px;
        border: none;
    }
    
        
    </style>
</head>
<body>
    <div class="main__container">
        <!-- header -->
        <div class="header__container">
            <div class="header__inner__container">
                   <!-- logo image -->
                    <div class="header__logo">
                        <img src="./asset/logo.png" class="logo"/>
                    </div>
            <!-- Navigations -->
            <div>
                <button class="header__button">About us</button>
                <button class="header__button">Contact us</button>
                <button class="header__button">Home</button>
            </div>
            </div>
        </div>
        <!-- content -->
        <div id="content__containter">
            <div class="content__inner__container">
                <h1 class="content__title">BUELAH CHILDREN'S <span >FOUNDATION</span> </h1>
                <div>
                    <button class="content__button"> click here </button>
                </div>
            </div>

        </div>
        <!-- footer -->
        <div>
            <h4>copyright Emmanuel 2026</h4>
        </div>
    </div>
</body>
</html>
